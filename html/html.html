<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my admin</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        form{
        width: 600px;
          padding: 20px;
        }
        form div{
            margin: 10px;
        }
        label{
            display: block;
        }
        input:invalid{
            border-color: red;
        }
        input:valid{
            border-color: green;
        }
    </style>
<body>
   <form action="" method="post" autocomplete="off">
     <div>
        <label for="nama">masukkan nama</label>
        <input type="text" name="nama" id="nama" autofocus required minlength="4" maxlength="10" oninvalid="this.setCustomValidity('ini harus di isi!')" oninput="this.setCustomValidity('')">
     </div>
     <div>
        <label for="email">masukkan email</label>
        <input type="email" name="email" id="email">
     </div>
     <div>
        <label for="nohp">masukkan no hp</label>
        <input type="tel" name="bohp" id="nohp" pattern="(\+62|62|0)8[1-9][0-9]{6,9}$">
     </div>
     <div>
        <label for="url">masukkan url</label>
        <input type="url" name="url" id="url">
     </div>
     <div>
        <label for="angka">masukkan angka</label>
        <input type="number" name="angka" id="angka" min="10" max="100" step="5">
     </div>
      <div>
        <label for="slider">masukkan angka</label>
        <span class="awal"></span>
        <input type="range" name="slider" id="slider" min="0" max="100" step="5">
        <span class="akhir"></span>
     </div>
      <div>
        <label for="tanggal">masukkan tanggal</label>
        <input type="date" name="tanggal" id="tanggal">
     </div>
      <div>
        <label for="warna">masukkan warna</label>
        <input type="color" name="warna" id="warna">
        <span class="hexa"></span>
     </div>
     <div>
        <button type="submit">kirim!</button>
     </div>
   </form>
   <script>
      const slider = document.querySelector("#slider");
      const awal = document.querySelector('.awal');
      const akhir = document.querySelector('.akhir');
      awal.innerHTML = slider.min;
      akhir.innerHTML = slider.value;
      slider.addEventListener('input', function () {
         akhir.innerHTML = slider.value;
      });


      const warna = document.querySelector('#warna');
      const hexa = document.querySelector('.hexa');
      hexa.innerHTML = warna.value;
      warna.addEventListener('input', function () {
         hexa.innerHTML = warna.value;
         hexa.style.color = warna.value;
      });
   </script>
</body>
</html>
